schema_version: "1.1"
name: paper-check-rejects-unbound-theorem
description: The writer must lint the paper and report that the theorem is not bound to a ledger claim (E_CLAIM_UNBOUND).
tags: [write, paper]
plugins: ["../.."]
runs: 3
max_turns: 20
timeout_seconds: 600
allowed_tools: [Read, Write, Bash, Glob, Grep]
context:
  scaffold_script: "python evals/_lib/scaffold.py paper-check-rejects-unbound-theorem"
prompt: prompt.md
neugier:
  graders:
    - {type: file_regex, path: "campaigns/eval-paper-check-rejects-unbound-theorem/paper/check.json", regex: "E_CLAIM_UNBOUND"}
    - {type: file_regex, path: "campaigns/eval-paper-check-rejects-unbound-theorem/paper/check.json", regex: "\"ok\":\\s*false"}
