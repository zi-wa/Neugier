<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="Neugier — curiosity, refereed. A mathematical research harness for Claude Code.">
  <defs>
    <style>
      .wordmark { font: 700 92px "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, "Times New Roman", serif; fill: #f0eefb; letter-spacing: -1px; }
      .pron     { font: 400 20px ui-sans-serif, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; fill: #8b8b9c; }
      .tag      { font: 600 28px ui-sans-serif, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; fill: #BDB2FF; letter-spacing: 0.4px; }
      .chip     { font: 500 16px ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; fill: #9d9db0; }
      .chipon   { font: 600 16px ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; fill: #1b1730; }
      .step     { font: 500 16px ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; fill: #74748a; }
      .stepon   { font: 700 16px ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; fill: #f0eefb; }
      .rule     { stroke: #2c2c3a; stroke-width: 2; }
    </style>
  </defs>

  <rect width="1200" height="300" fill="#0d0d14"/>
  <rect x="64" y="66" width="8" height="126" rx="4" fill="#BDB2FF"/>

  <text class="wordmark" x="104" y="148">Neugier</text>
  <text class="pron"     x="108" y="182">noy-geer</text>
  <text class="tag"      x="108" y="228">Curiosity, refereed.</text>

  <g transform="translate(780,60)">
    <rect x="0" y="0"   width="252" height="32" rx="16" fill="#BDB2FF" opacity="0.14"/>
    <text class="chip"   x="18" y="22">conjectured</text>
    <rect x="0" y="42"  width="252" height="32" rx="16" fill="#BDB2FF" opacity="0.24"/>
    <text class="chip"   x="18" y="64">numerically-supported</text>
    <rect x="0" y="84"  width="252" height="32" rx="16" fill="#BDB2FF" opacity="0.38"/>
    <text class="chip"   x="18" y="106">proof-drafted</text>
    <rect x="0" y="126" width="252" height="32" rx="16" fill="#BDB2FF"/>
    <text class="chipon" x="18" y="148">referee-passed</text>
  </g>

  <g transform="translate(64,262)">
    <text class="step"   x="0"   y="6">scout</text>
    <path class="rule" d="M54 1 h20"/>
    <text class="step"   x="84"  y="6">survey</text>
    <path class="rule" d="M150 1 h20"/>
    <text class="step"   x="180" y="6">plan</text>
    <path class="rule" d="M224 1 h20"/>
    <text class="step"   x="254" y="6">explore</text>
    <path class="rule" d="M330 1 h20"/>
    <text class="step"   x="360" y="6">prove</text>
    <path class="rule" d="M416 1 h20"/>
    <text class="stepon" x="446" y="6">review</text>
    <path class="rule" d="M516 1 h20"/>
    <text class="step"   x="546" y="6">paper</text>
  </g>
</svg>
